name: Build Binaries

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Container
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Compute build metadata
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}

      - name: Grab binary
        run: |
          mkdir -p bin
          docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
          docker create --name pgloader ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
          docker cp pgloader:/usr/local/bin/pgloader bin/pgloader
          docker rm -f pgloader

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.meta.outputs.short_sha }}
          name: Build ${{ steps.meta.outputs.short_sha }}
          commit: ${{ github.sha }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "bin/pgloader"
          token: ${{ secrets.GITHUB_TOKEN }}
