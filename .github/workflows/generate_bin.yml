name: Build Binaries

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Container (${{ matrix.arch }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v7

      - name: Compute build metadata
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}-${{ matrix.arch }}

      - name: Grab binary
        run: |
          mkdir -p bin
          docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}-${{ matrix.arch }}
          docker create --name pgloader-${{ matrix.arch }} ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}-${{ matrix.arch }}
          docker cp pgloader-${{ matrix.arch }}:/usr/local/bin/pgloader bin/pgloader-linux-${{ matrix.arch }}
          docker rm -f pgloader-${{ matrix.arch }}
          chmod +x bin/pgloader-linux-${{ matrix.arch }}

      - name: Smoke test image
        run: docker run --rm --platform ${{ matrix.platform }} ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}-${{ matrix.arch }} --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgloader-${{ matrix.arch }}
          path: bin/pgloader-linux-${{ matrix.arch }}

  manifest-and-release:
    name: Publish manifest and release
    runs-on: ubuntu-26.04
    needs: build

    steps:
      - name: Compute build metadata
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-arch image tags
        run: |
          docker buildx imagetools create \
            -t ${{ steps.meta.outputs.image }} \
            -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }} \
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}-amd64 \
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}-arm64

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pgloader-*
          path: bin
          merge-multiple: true

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.meta.outputs.short_sha }}
          name: Build ${{ steps.meta.outputs.short_sha }}
          commit: ${{ github.sha }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "bin/pgloader-linux-*"
          token: ${{ secrets.GITHUB_TOKEN }}
